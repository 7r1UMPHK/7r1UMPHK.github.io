<script>
/* 友链卡片等高：自动取当前全部卡片的最大高度，统一固定为该值 */
(function () {
  var grid = document.querySelector('.friend-grid');
  if (!grid) return;
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.friend-card'));
  var timer = null;

  function equalize() {
    grid.style.setProperty('--friend-card-height', 'auto');
    void grid.offsetHeight;
    var max = 0;
    cards.forEach(function (card) {
      max = Math.max(max, card.getBoundingClientRect().height);
    });
    if (max > 0) {
      grid.style.setProperty('--friend-card-height', max + 'px');
    }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(equalize, 60);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', schedule);
  } else {
    schedule();
  }
  window.addEventListener('load', schedule);
  window.addEventListener('resize', schedule);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(schedule).catch(function () {});
  }
})();
</script>
