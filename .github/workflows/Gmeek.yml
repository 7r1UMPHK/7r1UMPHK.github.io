name: build Gmeek

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  schedule:
    - cron: "0 16 15 * *"

concurrency:
  group: gmeek-build
  cancel-in-progress: false

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule' }}
    permissions:
      contents: write   # 仅为提交 backup/ 备份
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Clone pinned Gmeek
        run: |
          set -euo pipefail
          GMEEK_REPO=$(jq -r '.GMEEK_REPO // "https://github.com/7r1UMPHK/Gmeek.git"' config.json)
          GMEEK_VERSION=$(jq -r '.GMEEK_VERSION' config.json)
          git clone "$GMEEK_REPO" /opt/Gmeek
          cd /opt/Gmeek
          if [ "$GMEEK_VERSION" = "last" ]; then
            lastTag=$(git describe --tags "$(git rev-list --tags --max-count=1)")
            git checkout "$lastTag"
          else
            git checkout "$GMEEK_VERSION"
          fi
          echo "Gmeek: $(git rev-parse --short HEAD)"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install "lxml==6.1.2" -r /opt/Gmeek/requirements.txt cmarkgfm

      - name: Build site
        run: |
          set -euo pipefail
          cp -r ./* /opt/Gmeek/
          cd /opt/Gmeek

          set +e
          python Gmeek.py "${{ github.token }}" "${{ github.repository }}" \
            --issue_number '${{ github.event.issue.number }}'
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "Primary build failed; retrying with local cmark-gfm fallback..."
            GMEEK_CMARK_FALLBACK=1 \
            PYTHONPATH="/opt/Gmeek/scripts:${PYTHONPATH:-}" \
              python Gmeek.py "${{ github.token }}" "${{ github.repository }}" \
                --issue_number '${{ github.event.issue.number }}'
          fi

          cp -a /opt/Gmeek/docs "${{ github.workspace }}/"
          cp -a /opt/Gmeek/backup "${{ github.workspace }}/"
          cp /opt/Gmeek/blogBase.json "${{ github.workspace }}/"

      - name: Patch standalone pages
        run: python3 scripts/postbuild.py

      - name: Generate wordcount.json
        run: |
          python3 - <<'PY'
          import json, math
          with open('blogBase.json', encoding='utf-8') as f:
              base = json.load(f)
          posts = base.get('postListJson', {}) or {}
          per_page = int(base.get('onePageListNum') or 15)
          data = {
              'total': sum(int(v.get('wordCount') or 0) for v in posts.values()),
              'posts': len(posts),
              'perPage': per_page,
              'totalPages': max(1, math.ceil(len(posts) / per_page)),
          }
          with open('docs/wordcount.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)
          print('wordcount.json ->', data)
          PY

      - name: Check generated site
        run: python3 scripts/check_site.py

      - name: Update issue backups
        run: |
          set -euo pipefail
          git config --local user.name "${{ github.repository_owner }}"
          git config --local user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then
            echo "backup unchanged"
          else
            git commit -m "chore: update issue backups"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.

  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
